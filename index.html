<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="From us with love">
<title>From us with love</title>
<style>
  :root{
    --bg1:#ffe9d6; --bg2:#ffd1dc; --ink:#3b2a3a; --accent:#e8506e; --gold:#f5b942; --card:#fff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Helvetica Neue",sans-serif;
    color:var(--ink);
    background:var(--bg1);
    padding:max(env(safe-area-inset-top),20px) 16px max(env(safe-area-inset-bottom),24px);
  }
  body::before{content:"";position:fixed;inset:-30px;z-index:-1;
    background:linear-gradient(160deg,#ffe9d6d9,#ffd1dce6),url(photos/familie.jpg) center/cover;filter:blur(16px)}
  header{text-align:center;margin:8px auto 18px;max-width:520px}
  .hero{display:block;width:100%;border-radius:20px;box-shadow:0 8px 24px #0004;border:4px solid #fff;margin:0 0 14px}
  .head-text{background:#ffffffb3;border-radius:18px;padding:10px 14px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  header h1{margin:0;font-size:2rem;letter-spacing:-.5px}
  header p{margin:6px 0 0;opacity:.8}
  #countdown{display:inline-block;margin-top:10px;padding:6px 14px;border-radius:99px;background:#fff;font-weight:600;font-size:.95rem}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:520px;margin:0 auto}
  .door{
    aspect-ratio:1;border:0;border-radius:16px;font:inherit;position:relative;
    background:var(--card);color:var(--ink);font-size:1.5rem;font-weight:800;
    box-shadow:0 4px 10px #0002;cursor:pointer;transition:transform .15s;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  }
  .door small{font-size:.65rem;font-weight:600;opacity:.6;text-transform:uppercase}
  .door:active{transform:scale(.94)}
  .door.open{background:linear-gradient(135deg,var(--accent),#ff8a6b);color:#fff}
  .door.open small{opacity:.9}
  .door.today{animation:pulse 1.6s infinite;outline:3px solid var(--gold)}
  .door.locked{opacity:.55;cursor:default}
  .door.locked::after{content:"🔒";position:absolute;top:4px;right:6px;font-size:.7rem}
  .door.last{grid-column:span 2;aspect-ratio:2/1;background:linear-gradient(135deg,var(--gold),#ff8a6b);color:#fff}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}

  #modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
  #modal.show{display:flex}
  .sheet{background:var(--card);border-radius:24px;max-width:460px;width:100%;max-height:92vh;overflow:auto;padding:16px;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  .photo{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:4/5;background:#eee;display:flex;align-items:center;justify-content:center}
  .photo img{width:100%;height:100%;object-fit:cover;display:block}
  .photo .ph{font-size:6rem}
  .photo.talking{animation:talk .35s ease-in-out infinite alternate}
  @keyframes talk{from{transform:scale(1) rotate(-.6deg)}to{transform:scale(1.015) rotate(.6deg)}}
  .photo svg{width:100%;height:100%;display:block}
  #svgwrap{position:absolute;inset:0}
  .bubble{margin-top:14px;font-size:1.15rem;line-height:1.5;text-align:center;min-height:5em}
  .bubble span{opacity:.25;transition:opacity .2s}
  .bubble span.on{opacity:1}
  .row{display:flex;gap:10px;margin-top:12px}
  .row button{flex:1;border:0;border-radius:14px;padding:12px;font:inherit;font-weight:700;font-size:1rem;cursor:pointer}
  #again{background:var(--accent);color:#fff}
  #close{background:#eee;color:var(--ink)}
  canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:20}
  .hint{text-align:center;font-size:.8rem;margin:18px auto 0;max-width:520px;padding:6px 12px;border-radius:12px;background:#ffffffb3;width:fit-content}
</style>
</head>
<body>
<header>
  <img class="hero" src="photos/familie.jpg" alt="">
  <div class="head-text">
    <h1>From us with love 💌</h1>
    <p>Elke dag een vakje. Tik en luister.</p>
    <div id="countdown"></div>
  </div>
</header>

<div class="grid" id="grid"></div>
<p class="hint" id="hint"></p>

<div id="modal" role="dialog" aria-modal="true">
  <div class="sheet">
    <div class="photo" id="photo"><span class="ph" id="ph">🐶</span><img id="img" alt="" hidden><div id="svgwrap"></div></div>
    <div class="bubble" id="bubble"></div>
    <div class="row"><button id="again">🔊 Nog een keer</button><button id="close">Sluiten</button></div>
  </div>
</div>
<canvas id="confetti"></canvas>

  {d:21, emoji:"👦", photo:"photos/dag21.jpg", say:"Hé schat, hoe gaat het daar? Kun je mij even een recept doorsturen van lekker Indonesisch eten? Lof joe!", jaw:{w:900,h:1125,hinge:[570,600],top:[[262,658],[440,640]],ellipse:[350,652,88,14],tilt:-4,poly:[[205,655],[262,658],[440,640],[540,640],[552,690],[540,760],[490,820],[400,850],[320,850],[250,815],[210,770],[185,710]],dy:16,angle:-1,feather:.8,wc:"#2c0f0f"}, text:"Hé schat, hoe gaat het daar? Kun je mij even een recept doorsturen van lekker Indonesisch eten? Lof Joe!"},

  {d:24, emoji:"❤️", photo:"photos/dag24.jpg", ar:"1200/640", say:"Bijna thuis! We hebben je gemist en houden van je!", jaw:[{"w":1200,"h":640,"hinge":[238,356],"top":[[128,379],[192,378]],"ellipse":[160,380,30,12],"tilt":-0.5,"poly":[[119,379],[200,378],[216,388],[214,415],[198,435],[169,445],[138,440],[112,422],[100,400],[104,385]],"dy":18,"angle":-1,"feather":0.8,"wc":"#2a0c10","amp":1},{"w":1200,"h":640,"hinge":[538,312],"top":[[460,326],[504,325]],"ellipse":[482,328,21,11],"tilt":-0.5,"poly":[[450,328],[515,326],[522,344],[515,362],[498,374],[478,376],[459,370],[446,356],[441,340]],"dy":16,"angle":-1,"feather":0.8,"wc":"#2a0c10","amp":0.9},{"w":1200,"h":640,"hinge":[752,225],"top":[[665,238],[722,235]],"ellipse":[692,239,28,12],"tilt":-1.5,"poly":[[652,239],[728,236],[740,248],[735,262],[718,275],[692,280],[668,275],[650,265],[642,250]],"dy":16,"angle":-1,"feather":0.8,"wc":"#2a0c10","amp":1},{"w":1200,"h":640,"hinge":[1062,312],"top":[[972,318],[1030,330]],"ellipse":[1001,325,28,12],"tilt":10,"poly":[[962,314],[1038,334],[1048,348],[1038,362],[1019,375],[994,379],[969,371],[954,356],[948,335]],"dy":18,"angle":-1,"feather":0.8,"wc":"#2a0c10","amp":0.95}], text:"Bijna thuis, we hebben je gemist en houden van je.", last:true},

/* ===== LOGICA ===== */
const params = new URLSearchParams(location.search);
// ?test=1 opent alles, ?dag=2026-10-14 simuleert een datum
function today(){
  const s = params.get("dag");
  if(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
  const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate());
}
const TEST = params.has("test");
const T = today();
const dateOf = o => new Date(YEAR, MONTH-1, o.d);
const isUnlocked = o => TEST || dateOf(o) <= T;

const grid = document.getElementById("grid");
const opened = new Set();
try{ JSON.parse(localStorage.getItem("opened")||"[]").forEach(x=>opened.add(x)); }catch(e){}
const save = ()=>{ try{ localStorage.setItem("opened", JSON.stringify([...opened])); }catch(e){} };
const monthShort = "okt";

DAYS.forEach((o,i)=>{
  const b = document.createElement("button");
  b.className = "door" + (o.last?" last":"");
  b.innerHTML = `${o.d}<small>${monthShort}</small>`;
  const unlocked = isUnlocked(o);
  if(!unlocked) b.classList.add("locked");
  if(unlocked && opened.has(o.d)) b.classList.add("open");
  if(+dateOf(o)===+T) b.classList.add("today");
  b.onclick = ()=>{
    if(!isUnlocked(o)){ b.animate([{transform:"translateX(-6px)"},{transform:"translateX(6px)"},{transform:"translateX(0)"}],{duration:250}); return; }
    openDay(o,b);
  };
  grid.appendChild(b);
});

// Aftelling tot thuiskomst
const home = new Date(YEAR,MONTH-1,24);
const left = Math.round((home-T)/86400000);
document.getElementById("countdown").textContent =
  left>0 ? "We wensen je heel veel plezier op deze hele toffe reis!" : left===0 ? "Vandaag kom je thuis! 🎉" : "Welkom thuis ❤️";
const next = DAYS.find(o=>dateOf(o)>T);
document.getElementById("hint").textContent = TEST ? "Testmodus: alle vakjes zijn open" : (next ? `Het volgende vakje gaat open op ${next.d} oktober.` : "");

// Modal + spraak
const modal = document.getElementById("modal"), photo = document.getElementById("photo");
const bubble = document.getElementById("bubble"), img = document.getElementById("img"), ph = document.getElementById("ph");
let current = null, jaw = null, cur = 0, target = 0, raf = null, beat = null;
const svgwrap = document.getElementById("svgwrap");
const NS = "http://www.w3.org/2000/svg";

// Pepper praat: de onderkaak is een apart plaatje dat om een scharnier draait
function buildJaw(o){
  const J=Array.isArray(o.jaw)?o.jaw:[o.jaw], W=J[0].w, H=J[0].h, pts=a=>a.map(p=>p.join(",")).join(" ");
  let defs="", wedges="", jaws="";
  J.forEach((j,i)=>{
    defs += `<filter id="soft${i}" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="${j.feather ?? 5}"/></filter>
      <filter id="soft2${i}" x="-10%" y="-30%" width="120%" height="160%"><feGaussianBlur stdDeviation="${j.wb ?? 2.5}"/></filter>
      <mask id="jm${i}" maskUnits="userSpaceOnUse" x="0" y="0" width="${W}" height="${H}"><polygon points="${pts(j.poly)}" fill="#fff" filter="url(#soft${i})"/></mask>`;
    wedges += j.ellipse
      ? `<clipPath id="wcl${i}"><rect x="0" y="${j.ellipse[1]}" width="${W}" height="${H}" transform="rotate(${j.tilt||0} ${j.ellipse[0]} ${j.ellipse[1]})"/></clipPath>
         <g clip-path="url(#wcl${i})"><g transform="rotate(${j.tilt||0} ${j.ellipse[0]} ${j.ellipse[1]})"><ellipse id="wedge${i}" cx="${j.ellipse[0]}" cy="${j.ellipse[1]}" rx="${j.ellipse[2]}" ry="0" fill="${j.wc || '#140506'}"/></g></g>`
      : `<polygon id="wedge${i}" fill="${j.wc || '#1c0a0e'}" fill-opacity="${j.wo ?? .92}" filter="url(#soft2${i})" points=""/>`;
    jaws += `<g id="jawg${i}"><g mask="url(#jm${i})"><image href="${o.photo}" width="${W}" height="${H}"/></g></g>`;
  });
  svgwrap.innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice"><defs>${defs}</defs>
    <image href="${o.photo}" width="${W}" height="${H}"/>${wedges}${jaws}</svg>`;
  jaw = J.map((j,i)=>({j, g:svgwrap.querySelector("#jawg"+i), wedge:svgwrap.querySelector("#wedge"+i)}));
  applyJaw(0);
}
function moved(p,v,j){ const {hinge:[hx,hy],dy,angle}=j, a=angle*v*Math.PI/180, x=p[0]-hx, y=p[1]-hy;
  return [hx+x*Math.cos(a)-y*Math.sin(a), hy+x*Math.sin(a)+y*Math.cos(a)+dy*v]; }
function applyJaw(v0){
  if(!jaw) return;
  jaw.forEach(J=>{ const j=J.j, v=v0*(j.amp||1), {hinge:[hx,hy],dy,angle,top:[A,B]}=j;
    J.g.setAttribute("transform",`translate(${(j.dx||0)*v} ${dy*v}) rotate(${angle*v} ${hx} ${hy})`);
    // donkere bek precies in de opening tussen oude en nieuwe kaaklijn
    if(j.ellipse){ J.wedge.setAttribute("ry", j.ellipse[3]*v); J.wedge.style.display = v<.02 ? "none" : ""; return; }
    const A2=moved(A,v,j), B2=moved(B,v,j), up=j.up ?? 3;
    J.wedge.setAttribute("points",(j.tri ? [[A[0],A[1]-up],[B[0],B[1]],A2] : [[A[0],A[1]-up],[B[0],B[1]-up],B2,A2]).map(p=>p.join(",")).join(" "));
    J.wedge.style.display = v<.02 ? "none" : "";
  });
}
function tick(){ cur += (target-cur)*.5; applyJaw(cur);
  if(beat || Math.abs(cur-target)>.01) raf=requestAnimationFrame(tick); else { raf=null; applyJaw(0); } }
function startTalk(){ clearInterval(beat);
  beat=setInterval(()=>{ target = Math.random()<.2 ? .05 : .4+Math.random()*.6; },120);
  if(!raf) raf=requestAnimationFrame(tick); }
function stopTalk(){ clearInterval(beat); beat=null; target=0; if(!raf) raf=requestAnimationFrame(tick); }

function openDay(o,btn){
  current = o;
  svgwrap.innerHTML=""; jaw=null; photo.style.aspectRatio=o.ar||"";
  if(o.photo && o.jaw){ buildJaw(o); img.hidden=true; ph.hidden=true; }
  else if(o.photo){ img.src=o.photo; img.hidden=false; ph.hidden=true; }
  else { img.hidden=true; ph.hidden=false; ph.textContent=o.emoji||"💌"; }
  // woorden apart zodat ze oplichten tijdens het praten
  bubble.innerHTML = o.text.split(" ").map(w=>`<span>${w}</span>`).join(" ");
  modal.classList.add("show");
  opened.add(o.d); save(); btn.classList.add("open");
  boom();
  setTimeout(()=>speak(o.say||o.text), 350);
}
function closeModal(){ stop(); modal.classList.remove("show"); }
document.getElementById("close").onclick = closeModal;
document.getElementById("again").onclick = ()=>current && speak(current.say||current.text);
modal.addEventListener("click",e=>{ if(e.target===modal) closeModal(); });

let timer=null;
function setTalking(on){ photo.classList.toggle("talking",on); on ? startTalk() : stopTalk(); }
function stop(){ if("speechSynthesis" in window) speechSynthesis.cancel(); clearInterval(timer); setTalking(false); }

let speakId=0;
function speak(src){
  stop(); const id=++speakId;
  const segs = typeof src==="string" ? [[src,"nl-NL"]] : src;
  const words = [...bubble.querySelectorAll("span")]; words.forEach(w=>w.classList.remove("on"));
  const finish = ()=>{ setTalking(false); words.forEach(w=>w.classList.add("on")); };
  if(!("speechSynthesis" in window)){ finish(); return; }
  const voices = speechSynthesis.getVoices();
  let idx = 0, gotBoundary = false;
  segs.forEach(([t,lang],i)=>{
    const u = new SpeechSynthesisUtterance(t);
    u.lang = lang; u.rate = .95; u.pitch = 1.1;
    const L = lang.toLowerCase();
    const v = voices.find(v=>v.lang && v.lang.replace("_","-").toLowerCase()===L) || voices.find(v=>v.lang && v.lang.toLowerCase().startsWith(L.slice(0,2)));
    if(v) u.voice = v;
    u.onstart = ()=>{ if(id!==speakId || i>0) return; setTalking(true);
      // vangnet: als de browser geen woordgrenzen meldt, lichten we woorden op tijd op
      timer = setInterval(()=>{ if(!gotBoundary && idx<words.length) words[idx++].classList.add("on"); }, 330);
    };
    u.onboundary = e=>{ if(id!==speakId) return; if(e.name==="word"||e.name===undefined){ gotBoundary=true; target=1; if(idx<words.length) words[idx++].classList.add("on"); } };
    u.onend = u.onerror = ()=>{ if(id!==speakId || i<segs.length-1) return; clearInterval(timer); finish(); };
    speechSynthesis.speak(u);
  });
}
if("speechSynthesis" in window) speechSynthesis.getVoices();

// Confetti
const cv = document.getElementById("confetti"), cx = cv.getContext("2d");
function boom(){
  cv.width = innerWidth; cv.height = innerHeight;
  const colors = ["#e8506e","#f5b942","#ff8a6b","#6ec6ff","#9be37d"];
  const ps = Array.from({length:90},()=>({x:innerWidth/2,y:innerHeight/2.2,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:Math.random()*6+3,c:colors[Math.random()*5|0],a:1}));
  (function f(){
    cx.clearRect(0,0,cv.width,cv.height); let alive=false;
    ps.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=.35; p.a-=.012; if(p.a>0){alive=true; cx.globalAlpha=p.a; cx.fillStyle=p.c; cx.fillRect(p.x,p.y,p.r,p.r*1.6);} });
    if(alive) requestAnimationFrame(f); else cx.clearRect(0,0,cv.width,cv.height);
  })();
}
